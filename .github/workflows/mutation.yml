name: Bounded mutation tests

# Full mutmut of src/abssctl times out and is a local `make mutmut-full` job.
# This workflow mutates one small module so a run finishes in CI.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutmut:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]" "mutmut>=2.4.4,<3"

      - name: Run bounded mutmut
        run: |
          PYTHONPATH="src" MUTANT_UNDER_TEST=1 \
            mutmut run --paths-to-mutate src/abssctl/exit_codes.py
